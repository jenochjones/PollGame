<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poll Game Host</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container">
<section id="lobbyScreen" class="screen">
<div class="card hero"><div><p class="eyebrow">Live Poll Game</p><h1>Host Screen</h1><p>Players join using:</p><div class="join-url" id="joinUrl">{{ join_url }}</div><div style="margin-top:15px;text-align:center"><img id="qrCode" style="max-width:220px;background:white;padding:10px;border-radius:16px;"></div></div><div class="host-actions"><button id="startBtn" class="primary">Start Game</button><button id="resetBtn" class="danger">Reset</button></div></div>
<section class="grid two"><div class="card"><h2>Status</h2><div id="statusText">Waiting for players...</div></div><div class="card"><h2>Players</h2><ul id="players" class="players"></ul></div></section>
</section>
<section id="questionScreen" class="screen hidden"><div class="card question-card"><div id="questionMeta"></div><h1 id="questionText"></h1><div class="stats"><span><strong id="playerCount">0</strong> players</span><span><strong id="answeredCount">0</strong> answered</span><span><strong id="timer">0</strong>s left</span></div><div id="options" class="options host-options"></div><div class="host-actions" style="margin-top:20px"><button id="questionResetBtn" class="danger">Reset Game</button></div></div></section>
<section id="resultsScreen" class="screen hidden"><div class="card"><div id="resultsQuestionMeta" class="eyebrow"></div><h1 id="resultsQuestion">Results</h1><div id="bars" class="bars"></div><button id="nextBtn" class="secondary">Next Question</button><button id="resultsResetBtn" class="danger">Reset Game</button><a id="downloadBtn" class="primary hidden" href="/download_results">Download CSV</a></div></section>
</main><script>
async function post(u,p={}){let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function bars(rs){let b=document.getElementById('bars');b.innerHTML='';let m=Math.max(1,...rs.map(x=>x.count));rs.forEach(r=>b.innerHTML+=`<div class='bar-row'><div>${r.option}</div><div class='bar-track'><div class='bar-fill' style='width:${r.count/m*100}%'></div></div><div>${r.count}</div></div>`)}
function render(s){joinUrl.textContent=s.join_url; let q=document.getElementById('qrCode'); if(q){q.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(s.join_url);} playerCount.textContent=s.player_count;answeredCount.textContent=s.answered_count;timer.textContent=s.seconds_left;players.innerHTML=s.players.map(p=>`<li>${p.name}</li>`).join('');
lobbyScreen.classList.toggle('hidden',s.status!=='lobby');questionScreen.classList.toggle('hidden',s.status!=='question');resultsScreen.classList.toggle('hidden',!(s.status==='results'||s.status==='finished'));
if(s.current_question){questionMeta.textContent=`Question ${s.current_question.number} of ${s.current_question.total}`;questionText.textContent=s.current_question.question;options.innerHTML=s.current_question.options.map(o=>`<div class='option-pill'>${o}</div>`).join(''); let rq=document.getElementById('resultsQuestion'); let rqm=document.getElementById('resultsQuestionMeta'); if(rq){rq.textContent=s.current_question.question;} if(rqm){rqm.textContent='Question '+s.current_question.number+' of '+s.current_question.total;}}
if(s.status==='results'||s.status==='finished') bars(s.results);downloadBtn.classList.toggle('hidden',!s.can_download)}
async function poll(){render(await (await fetch('/api/state')).json())}
startBtn.onclick=()=>post('/api/start').then(poll); nextBtn.onclick=()=>post('/api/next').then(poll); resetBtn.onclick=()=>post('/api/reset').then(poll); if(document.getElementById('questionResetBtn')) questionResetBtn.onclick=()=>post('/api/reset').then(poll); if(document.getElementById('resultsResetBtn')) resultsResetBtn.onclick=()=>post('/api/reset').then(poll); poll(); setInterval(poll,700);
</script></body></html>
